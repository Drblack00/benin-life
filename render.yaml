services:
  - type: web
    name: benin-life
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: benin-life-db
          property: connectionString

databases:
  - name: benin-life-db
    databaseName: beninlife
    plan: free
